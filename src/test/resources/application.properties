spring.application.name=alugafacil-api

spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:h2:mem:alugafacil_test;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:sa}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
