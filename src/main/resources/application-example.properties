# Copie estas propriedades para a configuração local da aplicação
# ou use as variáveis de ambiente descritas no README.md.
# Caso nenhuma variável seja definida, a aplicação inicia em modo Plug-and-Play (H2 em memória compatível com SQL Server).

spring.application.name=alugafacil-api
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:alugafacil;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
